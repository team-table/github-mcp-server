steps:
  - id: build-test-environment
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '--target', 'build', '-t', 'github-mcp-build', '.']
  - id: test-graphql
    name: gcr.io/cloud-builders/docker
    args: ['run', '--rm', '-e', 'CGO_ENABLED=0', 'github-mcp-build', 'go', 'test', './pkg/github', '-run', '^TestGraphQLOperation', '-count=1', '-v']
  - id: build-runtime
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
